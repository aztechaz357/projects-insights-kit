name: "1. Setup (最初に1回)"

# 既存の Project に見積・進め方・フィーバー用のフィールドを追加し、設定を insights-kit.json に保存する。
# 何度実行しても既存フィールド・既存 Issue は壊さない (足りないものだけ追加)。
on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "Project の URL (例: https://github.com/orgs/acme/projects/5)"
        required: true
        type: string
      planned_end_date:
        description: "計画完了日 (バッファを含まない) YYYY-MM-DD"
        required: true
        type: string
      start_date:
        description: "開始日 YYYY-MM-DD (空 = 今日)"
        required: false
        type: string
      buffer:
        description: "プロジェクトバッファ: auto = 三点見積から自動 / 数字 = 営業日数"
        required: true
        default: "auto"
        type: string
      cadence:
        description: "進め方"
        required: true
        default: "phase+sprint-2w"
        type: choice
        options:
          - phase+sprint-2w
          - sprint-2w
          - sprint-1w
          - phase
          - none
      estimate_field:
        description: "既存の見積 (数値) フィールド名 (空 = 「見積 (人日)」を新しく作る)"
        required: false
        type: string
      japan_holidays:
        description: "日本の祝日を営業日から除外する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: insights-kit
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      # 入力値は env 経由で渡す (スクリプトインジェクション対策)
      IN_PROJECT_URL: ${{ inputs.project_url }}
      IN_PLANNED_END: ${{ inputs.planned_end_date }}
      IN_START: ${{ inputs.start_date }}
      IN_BUFFER: ${{ inputs.buffer }}
      IN_CADENCE: ${{ inputs.cadence }}
      IN_ESTIMATE_FIELD: ${{ inputs.estimate_field }}
      IN_JP_HOLIDAYS: ${{ inputs.japan_holidays }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROJECT_TOKEN が登録されていません (README の手順 2)"; exit 1
          fi
          python kit/insights_kit.py check-token

      - name: Setup project
        run: |
          args=(--project-url "$IN_PROJECT_URL" --planned-end-date "$IN_PLANNED_END" --buffer "$IN_BUFFER" --cadence "$IN_CADENCE")
          [ -n "$IN_START" ] && args+=(--start-date "$IN_START")
          [ -n "$IN_ESTIMATE_FIELD" ] && args+=(--estimate-field "$IN_ESTIMATE_FIELD")
          [ "$IN_JP_HOLIDAYS" = "true" ] || args+=(--no-japan-holidays)
          python kit/insights_kit.py setup "${args[@]}"

      - name: Commit settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights-kit.json docs/
          git diff --cached --quiet || git commit -m "chore: insights kit setup"
          git push
